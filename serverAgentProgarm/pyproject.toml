[project]
name = "serveragentprogarm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "openai>=3.1.0",
    "paramiko>=5.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
serveragent = "app.cli:app"
